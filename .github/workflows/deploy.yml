name: Deploy para VPS ERP Drogaria Center

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build do Projeto (gerar dist/)
        run: npm run build

      - name: Empacotar artefato de deploy
        run: tar czf apierp-drogariacenter.tar.gz dist package.json package-lock.json

      - name: Listar conteúdo do pacote (debug)
        run: tar tzf apierp-drogariacenter.tar.gz

      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Enviar o pacote para a VPS e reiniciar o serviço
        env:
          SSH_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no root@103.199.184.22 "mkdir -p /var/www/apierp-drogariacenter"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no root@103.199.184.22 '
            if [ -d /var/www/apierp-drogariacenter/dist ]; then
              mv /var/www/apierp-drogariacenter/dist /var/www/apierp-drogariacenter/dist-$(date +%Y%m%d%H%M%S).bak
            fi
          '
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no apierp-drogariacenter.tar.gz root@103.199.184.22:/var/www/apierp-drogariacenter/apierp-drogariacenter.tar.gz
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no root@103.199.184.22 "
            cd /var/www/apierp-drogariacenter &&
            tar xzf apierp-drogariacenter.tar.gz &&
            rm apierp-drogariacenter.tar.gz &&
            npm ci --omit=dev &&
            node -r reflect-metadata ./node_modules/typeorm/cli.js migration:run -d dist/config/data-source.js &&
            systemctl restart apierp-drogariacenter && systemctl status apierp-drogariacenter --no-pager || true
          "
