name: Deploy para VPS PharmaMind

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Banco de teste efêmero só pra essa execução do workflow — descartado
    # ao final, sem relação nenhuma com o banco de produção.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmamind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: pharmamind_test
      JWT_SECRET: segredo-de-teste-do-ci
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations no banco de teste
        run: npm run migration:run

      - name: Rodar testes (bloqueia o deploy se algum falhar)
        run: npm test

      - name: Build do Projeto (gerar dist/)
        run: npm run build

      - name: Empacotar artefato de deploy
        run: tar czf pharmamind-api.tar.gz dist package.json package-lock.json

      - name: Listar conteúdo do pacote (debug)
        run: tar tzf pharmamind-api.tar.gz

      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Enviar o pacote para a VPS e reiniciar o serviço
        env:
          SSH_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no root@103.199.184.22 "mkdir -p /var/www/pharmamind-api"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no root@103.199.184.22 '
            if [ -d /var/www/pharmamind-api/dist ]; then
              mv /var/www/pharmamind-api/dist /var/www/pharmamind-api/dist-$(date +%Y%m%d%H%M%S).bak
            fi
          '
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no pharmamind-api.tar.gz root@103.199.184.22:/var/www/pharmamind-api/pharmamind-api.tar.gz
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no root@103.199.184.22 "
            cd /var/www/pharmamind-api &&
            tar xzf pharmamind-api.tar.gz &&
            rm pharmamind-api.tar.gz &&
            npm ci --omit=dev &&
            node -r reflect-metadata ./node_modules/typeorm/cli.js migration:run -d dist/config/data-source.js &&
            systemctl restart pharmamind-api && systemctl status pharmamind-api --no-pager || true
          "
